<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #wrap {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: grab;
        position: relative;
        background: rgba(0, 0, 0, 0.03);
        box-sizing: border-box;
        border: 4px solid transparent;
        border-radius: 10px;
        transition: border-color 0.15s ease;
      }
      #wrap.dragging {
        cursor: grabbing;
      }
      img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        pointer-events: none;
        -webkit-user-drag: none;
        transition: transform 0.08s ease-out;
      }
      #hint {
        position: absolute;
        bottom: 8px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: rgba(0, 0, 0, 0.45);
        pointer-events: none;
      }
      #wrap:focus {
        outline: none;
      }
      #wrap:focus-visible {
        outline: 2px solid rgba(0, 0, 0, 0.25);
        outline-offset: -2px;
      }
    </style>
  </head>
  <body>
    <div id="wrap" tabindex="0" aria-label="Bird photo. Arrow keys navigate.">
      <img id="photo" alt="Bird photo" draggable="false" />
      <div id="hint">←→ photos · ↑↓ birds · keyboard works app-wide</div>
    </div>
    <script>
      const THRESHOLD = 48;
      let height = 420;
      let imageOnly = false;
      let startX = 0;
      let startY = 0;
      let tracking = false;
      let sent = false;

      function sendMessage(type, data) {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type: type,
            ...data,
          },
          "*"
        );
      }

      function setValue(action) {
        sendMessage("streamlit:setComponentValue", {
          value: { action: action, t: Date.now() },
        });
      }

      function onRender(event) {
        if (event.data.type !== "streamlit:render") return;
        const args = event.data.args || {};
        height = Number(args.height) || 420;
        imageOnly = Boolean(args.image_only);
        const img = document.getElementById("photo");
        const wrap = document.getElementById("wrap");
        wrap.style.height = height + "px";
        const frameColor = args.frame_color || "";
        wrap.style.borderColor = frameColor || "transparent";
        wrap.style.borderStyle = frameColor
          ? args.frame_style || "solid"
          : "solid";
        if (args.image_url && img.src !== args.image_url) {
          img.src = args.image_url;
        }
        const hint = document.getElementById("hint");
        if (hint) {
          hint.style.display = args.show_hint === false ? "none" : "block";
          hint.textContent = imageOnly
            ? "←→ swipe photos"
            : "←→ photos · ↑↓ birds · keyboard works app-wide";
        }
        sendMessage("streamlit:setFrameHeight", { height: height });
      }

      window.addEventListener("message", onRender);
      sendMessage("streamlit:componentReady", { apiVersion: 1 });
      sendMessage("streamlit:setFrameHeight", { height: height });

      const wrap = document.getElementById("wrap");
      const img = document.getElementById("photo");

      function begin(x, y) {
        tracking = true;
        sent = false;
        startX = x;
        startY = y;
        wrap.classList.add("dragging");
      }

      function move(x, y) {
        if (!tracking || sent) return;
        const dx = x - startX;
        const dy = y - startY;
        if (imageOnly) {
          const dominant =
            Math.abs(dx) > Math.abs(dy)
              ? Math.max(-24, Math.min(24, dx * 0.15))
              : 0;
          img.style.transform = `translate(${dominant}px, 0)`;
          return;
        }
        const dominant =
          Math.abs(dx) > Math.abs(dy)
            ? Math.max(-24, Math.min(24, dx * 0.15))
            : 0;
        const vDominant =
          Math.abs(dy) >= Math.abs(dx)
            ? Math.max(-24, Math.min(24, dy * 0.15))
            : 0;
        img.style.transform = `translate(${dominant}px, ${vDominant}px)`;
      }

      function end(x, y) {
        if (!tracking) return;
        tracking = false;
        wrap.classList.remove("dragging");
        img.style.transform = "translate(0, 0)";
        if (sent) return;
        const dx = x - startX;
        const dy = y - startY;
        if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return;
        if (imageOnly) {
          if (Math.abs(dx) <= Math.abs(dy)) return;
          sent = true;
          setValue(dx < 0 ? "image_next" : "image_prev");
          return;
        }
        sent = true;
        if (Math.abs(dx) > Math.abs(dy)) {
          setValue(dx < 0 ? "image_next" : "image_prev");
        } else {
          setValue(dy < 0 ? "bird_next" : "bird_prev");
        }
      }

      wrap.addEventListener(
        "touchstart",
        (e) => {
          if (e.touches.length !== 1) return;
          begin(e.touches[0].clientX, e.touches[0].clientY);
        },
        { passive: true }
      );
      wrap.addEventListener(
        "touchmove",
        (e) => {
          if (!tracking || e.touches.length !== 1) return;
          move(e.touches[0].clientX, e.touches[0].clientY);
        },
        { passive: true }
      );
      wrap.addEventListener(
        "touchend",
        (e) => {
          const t = e.changedTouches[0];
          if (!t) return;
          end(t.clientX, t.clientY);
        },
        { passive: true }
      );
      wrap.addEventListener("touchcancel", () => {
        tracking = false;
        wrap.classList.remove("dragging");
        img.style.transform = "translate(0, 0)";
      });

      wrap.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "touch") return;
        if (e.button !== 0) return;
        wrap.setPointerCapture(e.pointerId);
        begin(e.clientX, e.clientY);
      });
      wrap.addEventListener("pointermove", (e) => {
        if (e.pointerType === "touch") return;
        if (!tracking) return;
        move(e.clientX, e.clientY);
      });
      wrap.addEventListener("pointerup", (e) => {
        if (e.pointerType === "touch") return;
        end(e.clientX, e.clientY);
      });
      wrap.addEventListener("pointercancel", () => {
        tracking = false;
        wrap.classList.remove("dragging");
        img.style.transform = "translate(0, 0)";
      });
    </script>
  </body>
</html>
