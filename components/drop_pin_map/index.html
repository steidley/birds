<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
      }
      #map {
        width: 100%;
        border-radius: 0.5rem;
        border: 1px solid rgba(49, 51, 63, 0.2);
        box-sizing: border-box;
      }
      #hint {
        margin: 0.35rem 0 0;
        font-size: 0.8rem;
        color: rgba(49, 51, 63, 0.7);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <p id="hint">Click the map to drop a pin and set this location.</p>
    <script>
      const DEFAULT_CENTER = [39.5, -98.35];
      const DEFAULT_ZOOM = 4;
      let map = null;
      let marker = null;
      let lastArgsKey = "";

      function sendMessage(type, data) {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type: type,
            ...data,
          },
          "*"
        );
      }

      function setFrameHeight(mapHeight) {
        const hint = document.getElementById("hint");
        const height =
          Math.max(120, Number(mapHeight) || 360) +
          (hint ? hint.offsetHeight + 8 : 8);
        sendMessage("streamlit:setFrameHeight", { height: height });
      }

      function publish(lat, lng) {
        sendMessage("streamlit:setComponentValue", {
          value: {
            lat: lat,
            lng: lng,
            t: Date.now(),
          },
        });
      }

      function placeMarker(lat, lng) {
        if (!map) return;
        if (marker) {
          marker.setLatLng([lat, lng]);
        } else {
          marker = L.marker([lat, lng], { draggable: true }).addTo(map);
          marker.on("dragend", () => {
            const pos = marker.getLatLng();
            publish(pos.lat, pos.lng);
          });
        }
      }

      function ensureMap(height) {
        const el = document.getElementById("map");
        el.style.height = Math.max(120, Number(height) || 360) + "px";
        if (map) {
          map.invalidateSize();
          return;
        }
        map = L.map(el, {
          zoomControl: true,
          attributionControl: true,
        });
        L.tileLayer(
          "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
          {
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: "abcd",
            maxZoom: 20,
          }
        ).addTo(map);
        map.on("click", (event) => {
          const { lat, lng } = event.latlng;
          placeMarker(lat, lng);
          publish(lat, lng);
        });
      }

      function onRender(event) {
        if (!event.data || event.data.type !== "streamlit:render") return;
        const args = event.data.args || {};
        const height = Number(args.height) || 360;
        const hasPin = Boolean(args.has_pin);
        const lat = hasPin ? Number(args.lat) : null;
        const lng = hasPin ? Number(args.lng) : null;
        const zoom = Number(args.zoom) || (hasPin ? 14 : DEFAULT_ZOOM);
        const argsKey = [hasPin, lat, lng, zoom, height].join("|");
        ensureMap(height);
        setFrameHeight(height);
        if (argsKey === lastArgsKey) {
          map.invalidateSize();
          return;
        }
        lastArgsKey = argsKey;
        if (hasPin && Number.isFinite(lat) && Number.isFinite(lng)) {
          placeMarker(lat, lng);
          map.setView([lat, lng], zoom);
        } else {
          if (marker) {
            map.removeLayer(marker);
            marker = null;
          }
          map.setView(DEFAULT_CENTER, zoom || DEFAULT_ZOOM);
        }
        setTimeout(() => {
          if (map) map.invalidateSize();
          setFrameHeight(height);
        }, 50);
      }

      window.addEventListener("message", onRender);
      sendMessage("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight(360);
    </script>
  </body>
</html>
